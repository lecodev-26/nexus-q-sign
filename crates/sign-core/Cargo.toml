[package]
name = "nexus-q-sign-core"
version = "0.1.0"
description = "Private in-process signing core for NEXUS-Q Sign"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
nexusq-core = { version = "=4.1.2", default-features = false }
nexusq-ml-dsa = { version = "=4.1.2", default-features = false, features = ["zeroize"] }
thiserror = "2"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["alloc"] }
sha2 = "0.10"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"

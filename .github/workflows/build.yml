name: NEXUS-Q Sign CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Sign Core tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Test Sign Core
        run: cargo test --locked --manifest-path crates/sign-core/Cargo.toml

  desktop-build:
    name: Desktop · ${{ matrix.platform }}
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build desktop application
        working-directory: apps/desktop
        run: cargo tauri build --target ${{ matrix.target }} -- --locked

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: nexus-q-sign-${{ matrix.target }}
          path: apps/desktop/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 14

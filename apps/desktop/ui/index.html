<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>NEXUS-Q Sign</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./sign.css">
  <link rel="stylesheet" href="./identity.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img src="./assets/nexus-q-mark.png" alt=""><span>NEXUS-Q <b>Sign</b></span></div>
      <div class="workspace-label">DOCUMENT WORKSPACE</div>
      <nav aria-label="Navegación principal">
        <button class="nav-item active" data-page="overview"><span>◫</span> Resumen</button>
        <button class="nav-item" data-page="sign"><span>✎</span> Firmar documento</button>
        <button class="nav-item" data-page="verify"><span>✓</span> Verificar firma</button>
        <button class="nav-item" data-page="identities"><span>◇</span> Identidades</button>
        <button class="nav-item" data-page="history"><span>◷</span> Historial</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span>⚙</span> Ajustes</button>
        <div class="vault-status"><i></i><span><b>Almacenamiento local</b><small>Independiente</small></span></div>
        <div class="version">NEXUS-Q Sign · v0.1.0</div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div><span class="eyebrow">NEXUS-Q ECOSYSTEM</span><h1 id="page-title">Resumen</h1></div><div class="top-actions"><span class="status-pill">PREVIEW DE DESARROLLO</span><button id="theme-toggle" class="icon-button" aria-label="Cambiar tema">◐</button></div></header>
      <section id="page-content" class="content"></section>
    </main>
  </div>
</body>
</html>

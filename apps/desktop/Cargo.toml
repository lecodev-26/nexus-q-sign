[package]
name = "nexus-q-sign"
version = "0.1.0"
description = "NEXUS-Q Sign detached document signing"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["alloc"] }
nexus-q-sign-core = { path = "../../crates/sign-core" }
getrandom = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }
